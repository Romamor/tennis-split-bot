<script>
(()=>{
'use strict';
const root=document.getElementById('tennis-review-v1'),screen=root.querySelector('#tennis-screen');
const names=['Алексей','Борис','Вера','Глеб','Денис','Елена','Ирина','Кирилл','Лена','Максим','Нина','Ольга','Павел','Руслан','Светлана','Тимур','Ульяна','Фёдор','Юлия','Яна','Антон','Виктор','Дарья','Егор','Зоя','Илья','Карина'];
let seq=100;
const account=id=>({id,name:names[id-1]||`Игрок ${id}`,tag:`player_${id}_demo`});
const player=(id,minutes=0,paid=0)=>({id,playing:true,minutes,paid,guests:0,guestMinutes:0});
const seed=(id,title)=>({id,title,defaultStartTime:'18:30',members:Array.from({length:27},(_,i)=>account(i+1)),admins:new Set(id===1?[2]:[4]),supers:new Set([3]),base:{},transfers:[],trainings:[{id:'t'+id,title:'Теннис в субботу',date:'2026-09-12',time:'18:30',phase:'OPEN',creator:3,players:[player(5,60,350),player(6,60,400),player(7,60),player(8,60)],applied:{},appliedPlayers:[],history:[],pin:'SENT'}]});
const groups=[seed(1,'Теннис по субботам'),seed(2,'Вечерний теннис')];
const state={actor:1,group:1,tid:'t1',view:'public',context:'group',page:0,filter:'mine',target:0,transfer:'',form:null,draft:null,selected:[],stack:[],error:'',notice:'',profileBack:null,guard:null,fullRoster:false};
const g=()=>groups.find(x=>x.id===state.group),t=()=>g().trainings.find(x=>x.id===state.tid)||g().trainings[0],me=()=>account(state.actor),admin=()=>g().admins.has(state.actor)||g().supers.has(state.actor),superuser=()=>g().supers.has(state.actor),editable=()=>['OPEN','REVIEW'].includes(t().phase),canFinish=()=>editable()&&(admin()||t().creator===state.actor);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hours=n=>(n/60).toLocaleString('ru-RU')+' ч',rub=n=>Math.abs(n).toLocaleString('ru-RU')+' ₽',signed=n=>(n>0?'+':n<0?'−':'')+rub(n),date=s=>s.split('-').reverse().join('.'),phase=p=>({OPEN:'Открыта',CLOSED:'Учтена',REVIEW:'Уточнение',CANCELLED:'Отменена'}[p]);
const key=(label,act,value='',disabled=false)=>`<button type="button" data-do="${act}" data-value="${esc(value)}"${disabled?' disabled':''}>${esc(label)}</button>`,row=(...keys)=>`<div class="tg-keyrow">${keys.join('')}</div>`;
const nav=(label,view)=>row(key(label,'nav',view));
function paging(list){let pages=Math.max(1,Math.ceil(list.length/8));state.page=Math.min(state.page,pages-1);return pages>1?row(key('‹ Назад','page',-1,state.page===0),key(`${state.page+1} / ${pages}`,'noop'),key('Дальше ›','page',1,state.page===pages-1)):''}
const slice=list=>list.slice(state.page*8,state.page*8+8),scope=()=>`<div class="tg-scope">${esc(g().title)}</div>`;
function snapshot(){return {view:state.view,context:state.context,page:state.page,tid:state.tid,target:state.target,transfer:state.transfer,filter:state.filter}}
function dirty(){return !!(state.form?.dirty||state.draft?.dirty||state.selected.length)}
function cleanStack(){state.stack=state.stack.filter(s=>!(s.view==='form'&&!state.form)&&!(s.view==='player'&&!state.draft))}
function go(view,opts={},guard=true){if(guard&&dirty()&&!['form','player','add_players','profile'].includes(view)){state.guard={from:snapshot(),view,opts};state.view='exit_confirm';render();return}cleanStack();if(!(state.view==='form'&&!state.form)&&!(state.view==='player'&&!state.draft))state.stack.push(snapshot());Object.assign(state,{view,page:0,error:'',notice:''},opts);render()}
function back(){if(dirty()){state.guard={from:snapshot(),back:true};state.view='exit_confirm';render();return}cleanStack();Object.assign(state,state.stack.pop()||{view:'menu',context:'private',page:0});state.error='';render()}
function history(text,training=t()){training.history.push({text,actor:me().name,time:'сейчас'})}
function mutate(fn,label){if(!editable())throw Error('Тренировка уже учтена или отменена. Изменения доступны администратору.');let before=JSON.stringify(t().players);fn();if(before!==JSON.stringify(t().players))history(label);render()}
function personal(){return t().players.find(p=>p.id===state.actor)}
function joined(){let p=personal();if(!p){p=player(state.actor);t().players.push(p)}else if(!p.playing){p.playing=true;p.minutes=0;p.guests=0;p.guestMinutes=0}return p}
function allocation(training=t()){
 const slots=[];training.players.forEach(p=>{if(p.playing&&p.minutes>0)slots.push({id:p.id,guest:0,time:p.minutes});if(p.playing&&p.guestMinutes>0)for(let i=1;i<=p.guests;i++)slots.push({id:p.id,guest:i,time:p.guestMinutes})});
 const total=training.players.reduce((a,p)=>a+p.paid,0),minutes=slots.reduce((a,s)=>a+s.time,0),known=total===0||minutes>0,effect={};training.players.forEach(p=>effect[p.id]=p.paid);
 if(minutes){slots.forEach((s,i)=>{s.index=i;s.share=Math.floor(total*s.time/minutes);s.rem=(total*s.time)%minutes});let remainder=total-slots.reduce((a,s)=>a+s.share,0);[...slots].sort((a,b)=>b.rem-a.rem||a.index-b.index).forEach(s=>{if(remainder-->0)s.share++});slots.forEach(s=>effect[s.id]=(effect[s.id]||0)-s.share)}
 const rows=[];training.players.filter(p=>p.playing||p.paid>0).forEach(p=>{const share=slots.find(s=>s.id===p.id&&s.guest===0)?.share||0;rows.push({id:p.id,name:account(p.id).name,time:p.playing?p.minutes:0,paid:p.paid,balance:known?p.paid-share:null});if(p.playing)for(let i=1;i<=p.guests;i++)rows.push({id:p.id,name:account(p.id).name+' гость '+i,time:p.guestMinutes,paid:0,balance:known?-(slots.find(s=>s.id===p.id&&s.guest===i)?.share||0):null})});return {total,minutes,known,effect,rows};
}
function table(training=t()){let calc=allocation(training);return `<h2>${esc(training.title)}</h2><p>${date(training.date)} ${training.time}<br>Статус: ${phase(training.phase)}</p>`+(calc.rows.length?`<table class="tg-table"><thead><tr><th>Участник</th><th>Время</th><th>Оплата</th><th>Баланс</th></tr></thead><tbody>${calc.rows.map(p=>`<tr><td><button class="tg-profile" data-do="profile" data-value="${p.id}">${esc(p.name)}</button></td><td>${hours(p.time)}</td><td>${rub(p.paid)}</td><td>${p.balance===null?'—':signed(p.balance)}</td></tr>`).join('')}</tbody></table><p class="tg-note">${training.phase==='REVIEW'?'Пока правки не применены, действует прежний расчёт.':!calc.known?'Для расчёта укажи наигранное время.':'Баланс указан по этой тренировке.'}</p>`:'<p>Пока никто не зарегался</p>')}
function balances(){const values={...g().base};g().trainings.forEach(t=>Object.entries(t.applied).forEach(([id,n])=>values[id]=(values[id]||0)+n));g().transfers.filter(t=>t.status==='ACTIVE').forEach(t=>{values[t.from]=(values[t.from]||0)+t.amount;values[t.to]=(values[t.to]||0)-t.amount});return values}
function suggested(){const b=balances(),give=Object.entries(b).filter(([,v])=>v<0).map(([id,v])=>({id:+id,n:-v})),get=Object.entries(b).filter(([,v])=>v>0).map(([id,v])=>({id:+id,n:v})),rows=[];let i=0,j=0;while(i<give.length&&j<get.length){let amount=Math.min(give[i].n,get[j].n);rows.push({from:give[i].id,to:get[j].id,amount});give[i].n-=amount;get[j].n-=amount;if(!give[i].n)i++;if(!get[j].n)j++}return rows.filter(x=>x.from===state.actor||x.to===state.actor)}
function mine(training){return ((training.creator===state.actor)&&['OPEN','REVIEW'].includes(training.phase))||training.players.some(p=>p.id===state.actor&&(p.playing||p.paid>0))||training.appliedPlayers.includes(state.actor)}
const tx=()=>g().transfers.find(x=>x.id===state.transfer);
function form(kind,values={}){state.form={kind,dirty:false,...values};go('form',{},false)}
function err(message){state.error=message;render()}
function need(condition,message){if(!condition)throw Error(message)}
function render(){
 const v=state.view,isAdmin=admin(),p=personal();let content='',buttons=[],composer='';
 root.querySelector('#tennis-chat-title').textContent=state.context==='group'?g().title:'Бот · '+g().title;
 root.querySelector('#tennis-chat-sub').textContent=state.context==='group'?g().members.length+' участников':'Личный чат · '+me().name;
 root.querySelector('#tennis-group-tab').setAttribute('aria-pressed',state.context==='group');root.querySelector('#tennis-private-tab').setAttribute('aria-pressed',state.context==='private');
 const roleOptions=root.querySelector('#tennis-role').options;[1,2,3].forEach((id,i)=>roleOptions[i].textContent=account(id).name+' · '+(g().supers.has(id)?'суперадмин':g().admins.has(id)?'админ бота':'участник'));
 if(v==='groups'){content='<h2>Выбери группу для расчётов</h2>';groups.forEach(x=>buttons.push(row(key(x.title,'choose-group',x.id))))}
 else if(v==='menu'){content=scope()+'<h2>Что хочешь сделать?</h2>';buttons=[row(key('🏓 Мои тренировки','my-trainings')),nav('💰 Мои расчёты','debts'),row(key('➕ Создать тренировку','new'))];if(isAdmin)buttons.push(row(key('📋 Управление тренировками','all-trainings')),nav('⚙️ Настройки группы','settings'));if(superuser())buttons.push(nav('👥 Администраторы бота','administrators'));buttons.push(nav('🔄 Сменить группу','groups'))}
 else if(v==='settings'){need(isAdmin,'Настройки доступны администратору этой группы');content=scope()+'<h2>Настройки группы</h2><p>Время по умолчанию используется только для новых тренировок.</p>';buttons=[row(key('Начало по умолчанию · '+g().defaultStartTime,'default-time')),nav('В меню группы','menu')]}
 else if(v==='trainings'){let list=g().trainings.filter(x=>state.filter!=='mine'||mine(x));content=scope()+`<h2>${state.filter==='mine'?'Мои тренировки':'Тренировки группы'} · ${list.length}</h2>`;let pages=paging(list);slice(list).forEach(x=>buttons.push(row(key(date(x.date)+' · '+x.title+' · '+phase(x.phase),'training',x.id))));buttons.push(pages,nav('В меню группы','menu'));if(!list.length)content+='<p>Записей пока нет.</p>'}
 else if(['public','training','participation','participation_time','participation_payment'].includes(v)){
  content=table();
  if(v==='public')buttons.push(row(key('Открыть','open')));
  else if(v==='training'){
   if(editable())buttons.push(row(key('Открыть участие','open')));
   if(isAdmin){if(['FAILED','UNKNOWN','UNPIN_FAILED'].includes(t().pin)){content+='<p>'+ (t().pin==='UNPIN_FAILED'?'Не удалось снять карточку с закрепа.':'Карточка не закреплена.')+' Проверь право бота закреплять сообщения.</p>';buttons.push(row(key(editable()?'📌 Повторить закрепление':'📌 Повторить снятие закрепа','retry-pin')))}if(editable())buttons.push(nav('Игроки','roster'),row(key('Изменить название и время','edit-details')));if(t().phase==='CLOSED')buttons.push(row(key('✏️ Исправить тренировку','reopen')));buttons.push(t().phase==='CANCELLED'?row(key('↩️ Восстановить тренировку','restore')):nav('🗑 Отменить тренировку','cancel_confirm'))}
   if(canFinish())buttons.push(nav(t().phase==='REVIEW'?'✅ Применить правки':'🧮 Учесть тренировку','preview_finish'));
   buttons.push(row(key('История изменений','history','training')),row(key('⬅️ Назад','back')),nav('В меню группы','menu'));
  }else{
   content=(state.context==='group'?'<div class="tg-privacy">Видно только вам · '+esc(me().name)+'</div>':'')+content;
   if(!editable()&&!isAdmin){content+='<p>Тренировка уже учтена или отменена.</p>';buttons.push(row(key('Закрыть','close')))}else{
    if(editable()){
     if(v==='participation_time'){buttons.push(row(key('+0,5 ч','minutes',30),key('+1 ч','minutes',60)),row(key('−0,5 ч','minutes',-30),key('−1 ч','minutes',-60)))}
     else if(v==='participation_payment'){buttons.push(row(...[5,50,100].map(n=>key('+'+n+' ₽','money',n))),row(...[5,50,100].map(n=>key('−'+n+' ₽','money',-n))))}
     else{if(p?.playing){buttons.push(nav('Оплата · '+rub(p.paid),'participation_payment'),nav('Время · '+hours(p.minutes),'participation_time'),row(key('Добавить гостя','guest',1,p.guests>=99),...(p.guests?[key('Убрать гостя','guest',-1)]:[])),row(key('Не участвую','leave')))}else{buttons.push(row(key('Присоединиться','join')));if(p?.paid>0)buttons.push(nav('Оплата · '+rub(p.paid),'participation_payment'))}}
    }
    if(isAdmin||canFinish())buttons.push(row(key(isAdmin?'✏️ Редактировать':'🧮 Учесть тренировку','private-training')));
    buttons.push(row(...(v!=='participation'?[key('⬅️ Назад','nav','participation')]:[]),key(state.context==='group'?'Закрыть':'Карточка тренировки','close')));
   }

 if(action==='save-training'){let f=state.form;need(f.kind==='ready','Сначала заполни тренировку');if(f.edit){need(admin()&&editable(),'Изменять может администратор открытой тренировки');Object.assign(t(),{title:f.title,date:f.date,time:f.time});history('Изменил название, дату или время')}else{let x={id:'new'+seq++,title:f.title,date:f.date,time:f.time,creator:state.actor,phase:'OPEN',players:[],applied:{},appliedPlayers:[],history:[],pin:'SENT'};g().trainings.unshift(x);state.tid=x.id;history('Опубликовал тренировку')};state.form=null;state.stack=[{view:'menu',context:'private',page:0},{view:'trainings',context:'private',page:0,filter:admin()?'all':'mine'}];go('training',{context:'private'},false);return}
 if(action==='finish'){need(canFinish(),'Учесть тренировку может её создатель или администратор этой группы');let c=allocation();need(c.minutes>0,'Укажи наигранное время хотя бы одного участника');need(c.total>0,'Укажи оплату стола');t().applied={...c.effect};t().appliedPlayers=t().players.filter(p=>p.playing).map(p=>p.id);t().phase='CLOSED';t().pin='UNPINNED';history('Учёл тренировку · '+rub(c.total));go('training',{context:'private'},false);return}
 if(['reopen','restore','cancel-training','retry-pin'].includes(action)){need(admin(),'Доступно администратору этой группы');if(action==='reopen'){need(t().phase==='CLOSED','Исправление открывается для учтённой тренировки');t().phase='REVIEW';history('Открыл исправление')}if(action==='cancel-training'){t().phase='CANCELLED';t().pin='UNPINNED';t().applied={};history('Отменил тренировку')}if(action==='restore'){need(t().phase==='CANCELLED','Тренировка не отменена');t().phase='OPEN';t().pin='NONE';history('Восстановил тренировку')}if(action==='retry-pin')t().pin=editable()?'SENT':'UNPINNED';go('training',{context:'private'},false);return}
 if(action==='profile'){go('profile',{target:Number(value)});return}
 if(action==='add-players'){need(admin(),'Добавлять может администратор группы');state.selected=[];go('add_players');return}
 if(action==='toggle-player'){let id=Number(value);state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];render();return}
 if(action==='pick-person'){go('pick',{},false);return}
 if(action==='picked'){let id=Number(value);if(!g().members.some(u=>u.id===id))g().members.push(account(id));if(!state.selected.includes(id))state.selected.push(id);go('add_players',{},false);return}
 if(action==='save-players'){need(admin()&&editable(),'Доступно администратору открытой тренировки');state.selected.forEach(id=>{let p=t().players.find(p=>p.id===id);if(p){if(!p.playing)Object.assign(p,{playing:true,minutes:0,guests:0,guestMinutes:0})}else t().players.push(player(id))});history('Добавил участников · '+state.selected.length);state.selected=[];go('roster',{},false);return}
 if(action==='player'){need(admin(),'Править игроков может администратор группы');state.target=Number(value);let p=t().players.find(p=>p.id===state.target);state.draft={value:structuredClone(p),original:JSON.stringify(p),dirty:false};go('player',{},false);return}
 if(action.startsWith('draft-')){let d=state.draft,p=d.value;if(action==='draft-paid'){form('paid');return}d.dirty=true;if(action==='draft-minutes'){p.minutes=Math.max(0,p.minutes+Number(value));p.guestMinutes=p.guests?p.minutes:0}else if(action==='draft-guest'){p.guests=Math.max(0,Math.min(99,p.guests+Number(value)));p.guestMinutes=p.guests?p.minutes:0}else if(action==='draft-money')p.paid=Math.max(0,p.paid+Number(value));else if(action==='draft-leave')Object.assign(p,{playing:false,minutes:0,guests:0,guestMinutes:0});else if(action==='draft-join')Object.assign(p,{playing:true,minutes:0});render();return}
 if(action==='save-player'){need(admin()&&editable(),'Сначала открой исправление тренировки');let d=state.draft,p=t().players.find(p=>p.id===d.value.id);need(JSON.stringify(p)===d.original,'Сохранённые данные уже изменились. Открой форму заново.');if(JSON.stringify(d.value)!==d.original){Object.assign(p,d.value);history('Исправил данные участника · '+account(p.id).name)}state.draft=null;go('roster',{},false);return}
 if(action==='transfer-person'){go('transfer_direction',{target:Number(value)});return}
 if(action==='transfer-direction'){form('transfer_amount',{from:value==='out'?state.actor:state.target,to:value==='out'?state.target:state.actor,date:'2026-09-12',note:'',amount:0});return}
 if(action==='suggested'){let x=JSON.parse(value);form('transfer_ready',{...x,date:'2026-09-12',note:'',dirty:true});return}
 if(action==='form-kind'){state.form.kind=value;render();return}
 if(action==='save-transfer'){let f=state.form;need([f.from,f.to].includes(state.actor),'Можно записать перевод только со своей стороны');if(similar(f)&&value!=='allow'){f.kind='transfer_duplicate';render();return}let x={id:'pay'+seq++,from:f.from,to:f.to,amount:f.amount,date:f.date,note:f.note,status:'ACTIVE',reviewer:null,recorded:Date.now(),history:[]};g().transfers.push(x);txHistory(x,'Записал перевод · '+rub(x.amount));state.transfer=x.id;state.form=null;go('transfer',{},false);return}
 if(action==='transfer'){go('transfer',{transfer:value});return}
 if(action==='edit-transfer'){let x=tx();need([x.from,x.to].includes(state.actor)&&x.status!=='CANCELLED','Исправлять могут стороны действующего перевода');form('edit_transfer_amount',{from:x.from,to:x.to,amount:x.amount,date:x.date});return}
 if(action==='save-transfer-edit'){let x=tx(),f=state.form;need([x.from,x.to].includes(state.actor),'Перевод доступен его сторонам');if(similar(f,x.id)&&value!=='allow'){f.kind='edit_transfer_duplicate';render();return}if(x.amount!==f.amount){x.amount=f.amount;txHistory(x,'Исправил сумму · '+rub(x.amount))}state.form=null;go('transfer',{},false);return}
 if(['review-transfer','confirm-transfer','cancel-transfer'].includes(action)){let x=tx();need([x.from,x.to].includes(state.actor),'Перевод доступен его сторонам');if(action==='review-transfer'){need(x.status==='ACTIVE','Перевод уже уточняется или отменён');x.status='REVIEW';x.reviewer=state.actor;txHistory(x,'Начал уточнение')}else{need(x.status==='REVIEW'&&x.reviewer===state.actor,'Завершить уточнение может тот, кто его начал');x.status=action==='confirm-transfer'?'ACTIVE':'CANCELLED';txHistory(x,action==='confirm-transfer'?'Подтвердил перевод':'Отменил запись')};render();return}
 if(action==='history'){go('history',{historyKind:value});return}
 if(action==='admin-person'){go('admin_person',{target:Number(value)});return}
 if(action==='set-admin'){need(superuser(),'Назначать могут администраторы Telegram-группы');if(Number(value)){need(!g().supers.has(state.target),'Старшие права меняются в Telegram');g().admins.add(state.target)}else g().admins.delete(state.target);render();return}
 if(action==='cancel-form'){back();return}
 if(action==='exit-continue'){Object.assign(state,state.guard.from);state.guard=null;render();return}
 if(action==='exit-discard'){let q=state.guard;state.form=null;state.draft=null;state.selected=[];state.guard=null;if(q.back){Object.assign(state,q.from);back()}else go(q.view,q.opts,false);return}
}
root.addEventListener('click',e=>{let button=e.target.closest('button[data-do]');if(!button||button.disabled)return;try{act(button.dataset.do,button.dataset.value)}catch(error){err(error.message)}});
root.addEventListener('submit',e=>{e.preventDefault();try{submit(new FormData(e.target).get('value').trim())}catch(error){err(error.message)}});
root.addEventListener('input',e=>{if(e.target.name==='value'&&state.form){state.form.dirty=true;state.form.pendingText=e.target.value}});
root.querySelector('#tennis-role').addEventListener('change',e=>{state.actor={user:1,admin:2,super:3}[e.target.value];state.form=null;state.draft=null;state.selected=[];state.stack=[];state.view=state.context==='group'?'public':'menu';state.error='';render()});
render();
if(globalThis.Tweak){const baseline=new Map();const tweak=new Tweak({container:root,onChange:()=>{const training=t();if(state.fullRoster){if(!baseline.has(training.id))baseline.set(training.id,structuredClone(training.players));g().members.forEach(u=>{if(!training.players.some(p=>p.id===u.id))training.players.push(player(u.id,60))})}else if(baseline.has(training.id)){training.players=baseline.get(training.id);baseline.delete(training.id)}render()}});tweak.addToggle(state,'fullRoster',{label:'Полный состав группы'})}
})();
</script>
