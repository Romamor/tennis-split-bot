const g=()=>groups.find(x=>x.id===state.group),t=()=>g().trainings.find(x=>x.id===state.tid)||g().trainings[0],me=()=>account(state.actor),admin=()=>g().admins.has(state.actor)||g().supers.has(state.actor),superuser=()=>g().supers.has(state.actor),editable=()=>t().phase==='OPEN',canEdit=()=>admin()||t().creator===state.actor,canFinish=()=>editable()&&canEdit(),closedMessage=()=>t().phase==='CANCELLED'?'Тренировка отменена':'Тренировка завершена';

function decorateSingleButton(markup){
 const action=(markup.match(/data-do="([^"]+)"/)||[])[1]||'',value=(markup.match(/data-value="([^"]*)"/)||[])[1]||'';
 return markup.replace(/(>)([^<>]*)(<\/button>)/,(all,open,label,close)=>{

  let icon=label.startsWith('Назад')||label==='К составу'?'⬅️':label.startsWith('Закрыть')||label==='Отмена'?'✖️':label==='Открыть'||label.startsWith('Присоединиться')?'🏓':label==='Не участвую'?'🚪':label.startsWith('Оплата')||label==='Другая сумма'?'💵':label.startsWith('Время')?'🕒':label.includes('Редактировать')||label.startsWith('Изменить название')?'✏️':label.includes('История')?'📜':label==='Баланс группы'||label==='К моим финансам'?'💰':label.startsWith('Приду')||label.includes('правильно')||label.startsWith('Сохранить')||label==='Опубликовать'||label==='Записать платёж'||label==='Платёж отправлен'?'✅':label==='Меню'?'🏠':label.startsWith('Изменить статус')?'🔄':label==='Открыта'?'🔓':label==='Отменена'?'🚫':label==='Завершена'?'✅':label==='Название'?'📝':label==='Тренировка'?'⚙️':label.includes('гостя')||label==='Управление игроками'?'👥':action.includes('group')?'👥':action.includes('training')?'🏓':action==='person'||action.includes('player')||action.includes('pick')||action==='admin-person'?'👤':action==='receive'||action==='finance-receive'||label==='Да, получил'?'📥':action.includes('payment')||action.includes('finance')||action==='detail'?'💸':'➡️';
  return open+icon+' '+label+close;
 });
}
function buttonStyle(label){return label==='Открыть'||label.startsWith('Присоединиться')?'primary':label==='Не участвую'?'danger':''}
const key=(label,act,value='',disabled=false)=>`<button type="button" data-do="${act}" data-value="${esc(value)}" data-style="${buttonStyle(label)}"${disabled?' disabled':''}>${esc(label)}</button>`,row=(...keys)=>`<div class="tg-keyrow">${(keys.length===1?keys.map(decorateSingleButton):keys).join('')}</div>`;
const nav=(label,view)=>row(key(label,'nav',view));
function paging(list,size=8){let pages=Math.max(1,Math.ceil(list.length/size));state.page=Math.min(state.page,pages-1);return pages>1?row(key('‹ Назад','page',-1,state.page===0),key(`${state.page+1} / ${pages}`,'noop'),key('Дальше ›','page',1,state.page===pages-1)):''}
const slice=(list,size=8)=>list.slice(state.page*size,state.page*size+size),scope=()=>'';
const allMine=()=>groups.flatMap(group=>group.trainings.filter(mine).map(x=>({...x,groupId:group.id}))).sort((a,b)=>b.createdAt-a.createdAt||b.id.localeCompare(a.id));
const availableGroups=(purpose)=>groups.filter(x=>x.members.some(u=>u.id===state.actor)&&(purpose==='manage'?(x.admins.has(state.actor)||x.supers.has(state.actor)):purpose==='administrators'?x.supers.has(state.actor):purpose==='create'?x.botAdmin:true));
function snapshot(){return {group:state.group,groupPurpose:state.groupPurpose,view:state.view,context:state.context,page:state.page,tid:state.tid,target:state.target,managed:state.managed,editorReturn:state.editorReturn,transfer:state.transfer,payment:state.payment,filter:state.filter}}

function cleanStack(){state.stack=state.stack.filter(s=>!(s.view==='form'&&!state.form)&&!(s.view==='player'&&!state.draft))}
function go(view,opts={},guard=true){if(guard&&dirty()&&!['form','player','add_players','profile'].includes(view)){state.guard={from:snapshot(),view,opts};state.view='exit_confirm';render();return}cleanStack();if(!(state.view==='form'&&!state.form)&&!(state.view==='player'&&!state.draft))state.stack.push(snapshot());Object.assign(state,{view,page:0,error:'',notice:''},opts);render()}
function back(){if(dirty()){state.guard={from:snapshot(),back:true};state.view='exit_confirm';render();return}cleanStack();Object.assign(state,state.stack.pop()||{view:'menu',context:'private',page:0});state.error='';render()}
function history(text,training=t()){training.history.push({text,actor:me().name,time:'сейчас'})}

function personal(){return t().players.find(p=>p.id===(state.managed?state.target:state.actor))}
function joined(){let p=personal();if(!p){p=player(state.managed?state.target:state.actor);t().players.push(p)}else if(!p.playing){p.playing=true;p.minutes=0;p.guests=0;p.guestMinutes=0}return p}
function allocation(training=t()){
 const slots=[];training.players.forEach(p=>{if(p.playing&&p.minutes>0)slots.push({id:p.id,guest:0,time:p.minutes});if(p.playing&&p.guestMinutes>0)for(let i=1;i<=p.guests;i++)slots.push({id:p.id,guest:i,time:p.guestMinutes})});
 const total=training.players.reduce((a,p)=>a+p.paid,0),minutes=slots.reduce((a,s)=>a+s.time,0),known=total===0||minutes>0,effect={};training.players.forEach(p=>effect[p.id]=p.paid);
 if(minutes){slots.forEach((s,i)=>{s.index=i;s.share=Math.floor(total*s.time/minutes);s.rem=(total*s.time)%minutes});let remainder=total-slots.reduce((a,s)=>a+s.share,0);[...slots].sort((a,b)=>b.rem-a.rem||a.index-b.index).forEach(s=>{if(remainder-->0)s.share++});slots.forEach(s=>effect[s.id]=(effect[s.id]||0)-s.share)}
 const rows=[];training.players.filter(p=>p.playing||p.paid>0).forEach(p=>{const share=slots.find(s=>s.id===p.id&&s.guest===0)?.share||0;rows.push({id:p.id,name:account(p.id).name,time:p.playing?p.minutes:0,paid:p.paid,balance:known?p.paid-share:null});if(p.playing)for(let i=1;i<=p.guests;i++)rows.push({id:p.id,name:account(p.id).name+' гость '+i,time:p.guestMinutes,paid:0,balance:known?-(slots.find(s=>s.id===p.id&&s.guest===i)?.share||0):null})});return {total,minutes,known,effect,rows};
}
function table(training=t()){let calc=allocation(training);let note=training.phase==='OPEN'?'':training.phase==='CANCELLED'?'':!calc.known?'Для расчёта укажи наигранное время.':'';return `<h2>${esc(training.title)}</h2><p>${date(training.date)} ${training.time}<br>Статус: ${phase(training.phase)}</p>`+(calc.rows.length?`<table class="tg-table"><thead><tr><th>Участник</th><th>Время</th><th>Оплата</th><th>Баланс</th></tr></thead><tbody>${calc.rows.map(p=>`<tr><td><button class="tg-profile" data-do="profile" data-value="${p.id}">${esc(p.name)}</button></td><td>${hours(p.time)}</td><td>${rub(p.paid)}</td><td>${p.balance===null?'—':signed(p.balance)}</td></tr>`).join('')}</tbody></table>${note?`<p class="tg-note">${note}</p>`:''}`:'<p>Пока никто не зарегался</p>')}
function balances(){const values={...g().base};g().trainings.forEach(t=>Object.entries(t.applied).forEach(([id,n])=>values[id]=(values[id]||0)+n));g().transfers.filter(t=>t.status==='COMPLETED').forEach(t=>{values[t.from]=(values[t.from]||0)+t.amount;values[t.to]=(values[t.to]||0)-t.amount});return values}
function suggested(){const b=balances();g().transfers.filter(x=>x.status==='PENDING').forEach(x=>{b[x.from]=(b[x.from]||0)+x.amount;b[x.to]=(b[x.to]||0)-x.amount});const give=Object.entries(b).filter(([,v])=>v<0).map(([id,v])=>({id:+id,n:-v})),get=Object.entries(b).filter(([,v])=>v>0).map(([id,v])=>({id:+id,n:v})),rows=[],sort=(a,b)=>b.n-a.n||String(a.id).localeCompare(String(b.id));while(give.length&&get.length){give.sort(sort);get.sort(sort);let amount=Math.min(give[0].n,get[0].n);rows.push({from:give[0].id,to:get[0].id,amount});give[0].n-=amount;get[0].n-=amount;if(!give[0].n)give.shift();if(!get[0].n)get.shift()}return rows.filter(x=>x.from===state.actor||x.to===state.actor)}
