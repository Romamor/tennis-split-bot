<div class="fp-tools"><label for="fp-role">Смотреть от имени</label><select id="fp-role"><option value="1">Алексей · участник</option><option value="2">Борис · администратор</option><option value="3">Вера · суперадминистратор</option></select></div>
<div class="fp-window"><div class="fp-header"><span class="fp-avatar" aria-hidden="true">🏓</span><div>Бот расчётов<div class="fp-sub" id="fp-context"></div></div></div><div class="fp-thread" id="fp-screen" aria-live="polite"></div></div>
<div class="fp-caption">Предложение интерфейса · 15 участников на странице · демонстрационные данные. Бот только записывает перевод; деньги не отправляются.</div>
<script>
(()=>{'use strict';
const root=document.getElementById('tennis-finance-proposal'),screen=root.querySelector('#fp-screen');
const names=['Алексей','Борис','Вера','Глеб','Денис','Елена','Ирина','Кирилл','Лена','Максим','Нина','Ольга','Павел','Рита','Сергей','Татьяна','Фёдор','Юлия','Яна','Антон','Вадим','Зоя'];
const groups=[{id:1,title:'Теннис по субботам',members:names.map((_,i)=>i+1),admins:[2,3],balances:{1:-323,2:923,3:-150,4:650,5:-700,6:400,7:-450,8:200,9:-250,10:100,11:-400},played:Array.from({length:20},(_,i)=>i+1),payments:[]},{id:2,title:'Вечерний теннис',members:[1,2,3,4,5,6],admins:[3],balances:{1:200,2:-200},played:[1,2,4],payments:[]}];
let sequence=0;const state={actor:1,group:1,view:'finance',page:0,draft:null,selected:null,error:'',historyScope:'mine',noticeOpened:false};
// Synthetic transfers between other participants make the administrator's history visible.
for(let i=0;i<12;i++){
 const from=4+i%8,to=4+(i+3)%8;
 groups[0].payments.push({id:++sequence,from,to,amount:50+(i%4)*25,status:i%4===0?'PENDING':'COMPLETED',mode:'personal',author:from,time:Date.UTC(2026,9,6,12)-i*86400000});
}
// One synthetic incoming transfer makes the approved notification visible immediately.
groups[0].payments.push({id:++sequence,from:2,to:1,amount:600,status:'PENDING',mode:'personal',author:2,time:Date.now(),notice:true});
const peoplePageSize=15;
const g=()=>groups.find(x=>x.id===state.group),admin=()=>g().admins.includes(state.actor),name=id=>names[id-1],money=n=>Math.abs(n).toLocaleString('ru-RU')+' ₽',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function decorateButton(markup){
 const action=(markup.match(/data-action="([^"]+)"/)||[])[1]||'',value=(markup.match(/data-value="([^"]*)"/)||[])[1]||'';
 return markup.replace(/(>)([^<>]*)(<\/button>)/,(all,open,label,close)=>{
  if(/^[\p{Extended_Pictographic}▲▼‹›]/u.test(label))return all;
  if(/^[+−-]\s*\d/.test(label))return open+(label.startsWith('+')?'➕ ':'➖ ')+label.replace(/^[+−-]\s*/,'')+close;
  let icon=label.startsWith('Округлить')?'🔢':label.startsWith('Предлагается ботом')?'🧮':label.startsWith('Отправить')||label.startsWith('Перевести')?'💸':label.startsWith('Принять платёж')?'💰':action==='noop'?'📄':label.startsWith('Записать перевод за')?'📝':label==='Записать свой перевод'?'✍️':label.startsWith('Назад')||label==='К составу'?'⬅️':label.startsWith('Закрыть')||label==='Отмена'||label==='Отменить перевод'||label==='Да, отменить'?'✖️':label==='Открыть'||label.startsWith('Присоединиться')?'🏓':label==='Не участвую'?'🚪':label==='Ввести сумму сообщением'||label==='Изменить сумму'?'✍️':label.startsWith('Оплата')?'💵':label.startsWith('Время')?'🕒':label.includes('Редактировать')||label.startsWith('Изменить название')?'✏️':label.includes('История')||label==='Все переводы группы'?'📜':label.startsWith('Баланс группы')?'📊':label==='К моим финансам'?'💰':label.startsWith('Приду')||label.includes('правильно')||label.startsWith('Сохранить')||label==='Опубликовать'||label==='Записать перевод'||label==='Перевод отправлен'?'✅':label==='Меню'?'🏠':label.startsWith('Изменить статус')?'🔄':label==='Открыта'?'🔓':label==='Отменена'?'🚫':label==='Завершена'?'✅':label==='Название'?'📝':label==='Тренировка'?'⚙️':label.includes('гостя')||label==='Управление игроками'?'👥':action.includes('group')?'👥':action.includes('training')?'🏓':action==='person'||action.includes('player')||action.includes('pick')||action==='admin-person'?'👤':action==='receive'||action==='finance-receive'||label==='Да, получил'?'📥':action.includes('payment')||action.includes('finance')||action==='detail'?'💸':'➡️';
  return open+icon+' '+label+close;
 });
}
function buttonStyle(label){return ['Открыть','Перевод отправлен','Записать перевод','Да, получил'].includes(label)||label.startsWith('Присоединиться')?'primary':['Не участвую','Отмена','Отменить перевод','Да, отменить'].includes(label)?'danger':''}
const key=(label,action,value='',disabled=false)=>decorateButton(`<button type="button" data-action="${action}" data-value="${value}" data-style="${buttonStyle(label)}" aria-label="${esc(label)}"${disabled?' disabled':''}>${esc(label)}</button>`),row=(...x)=>`<div class="fp-row">${x.join('')}</div>`;
const nav=()=>row(key('Назад','back'),key('Отмена','cancel'));
function go(view){state.editingPaymentAmount=null;delete state.paymentAmountText;state.view=view;state.page=0;state.error='';render()}
function totals(pending=false){const b={...g().balances};for(const p of g().payments)if(p.status==='COMPLETED'||pending&&p.status==='PENDING'){b[p.from]=(b[p.from]||0)+p.amount;b[p.to]=(b[p.to]||0)-p.amount}return b}
// Direct settlement portfolio, mirrored from core/DirectSettlement.kt for these demo screens.
function directSettlements(b) {
 const ids=Object.keys(b).filter(id=>b[id]!==0).sort(),values=ids.map(id=>b[id]);
 if(!ids.length)return [];
 const senders=values.map((v,i)=>v<0?i:-1).filter(i=>i>=0);
 const fit=(x,y,need)=>x>=need&&y>=need?x<y:x>=need?true:y>=need?false:x>y;
 function build(mode,offset,matchFirst){
  const rest=[...values],out=[],counts=Array(ids.length).fill(0);
  const pay=(from,to)=>{const amount=Math.min(-rest[from],rest[to]);out.push({from:Number(ids[from]),to:Number(ids[to]),amount});rest[from]+=amount;rest[to]-=amount;counts[from]++};
  if(matchFirst)for(let i=0;i<rest.length;i++)if(rest[i]<0)for(let j=0;j<rest.length;j++)if(rest[j]===-rest[i]){pay(i,j);break}
  while(true){
   let from=-1,to=-1;
   if(mode>=5){
    for(let j=0;j<rest.length;j++)if(rest[j]>0&&(to<0||(mode===5?rest[j]>rest[to]:rest[j]<rest[to])))to=j;
    if(to>=0)for(let i=0;i<rest.length;i++)if(rest[i]<0&&(from<0||fit(-rest[i],-rest[from],rest[to])))from=i;
   }
   if(from<0)for(let step=0;step<rest.length;step++){
    const i=(step+offset)%rest.length;if(rest[i]>=0)continue;
    if(from<0||(mode===2?rest[i]>rest[from]:mode===3?false:rest[i]<rest[from]))from=i;
   }
   if(from<0)break;
   if(to<0)for(let j=0;j<rest.length;j++)if(rest[j]>0&&(to<0||(mode===4?fit(rest[j],rest[to],-rest[from]):rest[j]>rest[to])))to=j;
   pay(from,to);
  }
  return {out,max:Math.max(...counts)};
 }
 const choices=[build(0,0,false)];
 for(let mode=1;mode<=6;mode++)for(let step=0;step<(mode===3?4:1);step++)choices.push(build(mode,senders[Math.floor(step*senders.length/4)],true));
 const fewest=Math.min(...choices.map(x=>x.out.length));
 return choices.filter(x=>x.out.length<=fewest+1).sort((a,c)=>a.max-c.max||a.out.length-c.out.length)[0].out;
}
// End direct settlement portfolio.
function suggestions(){return directSettlements(totals(true))}
function available(){return suggestions().filter(x=>x.from===state.actor)}
function roundingButton(disabled=false){return key('🔢 Округлить','round',100,disabled)}
function roundPaymentAmount(amount){return Math.round(amount/100)*100}

function refreshPaymentProposal(d){
 const proposal=suggestions().find(x=>x.from===d.from&&x.to===d.to);
 if(proposal)d.calculatedAmount=proposal.amount;else delete d.calculatedAmount;
}
function amountReset(d){
 const amount=d.amount;
 const target=d.calculatedAmount;
 if(target===undefined)return '';
 const label='Предлагается ботом '+money(target);
 return row(key(label,'reset-round','',amount===target||!Number.isSafeInteger(amount)));
}
function amountControls(d){
 const amount=d.amount;
 const invalid=!Number.isSafeInteger(amount)||amount<0;
 const canRound=d.roundingAvailable===true&&d.roundingOriginal===undefined&&!invalid&&amount>0&&roundPaymentAmount(amount)!==amount;
 return [
  row(roundingButton(!canRound)),
  row(key('+50 ₽','adjust-amount',50,invalid),key('+100 ₽','adjust-amount',100,invalid)),
  row(key('−50 ₽','adjust-amount',-50,invalid||amount<=0),key('−100 ₽','adjust-amount',-100,invalid||amount<=0))
 ];
}
function setPaymentAmount(d,amount){
 if(!Number.isSafeInteger(amount)||amount<0)throw Error('Укажи сумму целыми рублями');
 d.amount=amount;delete d.amountText;d.waitingForAmount=false;
}
function parsePaymentAmount(text){
 const value=String(text).trim();
 if(!/^\d+$/.test(value)||!Number.isSafeInteger(+value)||+value<=0)throw Error('Укажи положительную сумму в целых рублях');
 return +value;
}
function commitTypedAmount(d,text){setPaymentAmount(d,parsePaymentAmount(text))}

function restoreAmount(d){
 const amount=d.calculatedAmount;
 if(!Number.isSafeInteger(amount)||amount<0)throw Error('Сумма для возврата недоступна');
 setPaymentAmount(d,amount);if(d.calculatedAmount!==undefined)delete d.balancePresetAmount;
 delete d.roundingOriginal;d.roundingAvailable=d.calculatedAmount!==undefined||d.balancePresetAmount!==undefined;
}
function editableAmount(d){return d.amount}
function paymentComposer(d){return `<div class="fp-composer" role="group" aria-label="Сообщение боту"><input id="fp-amount" aria-label="Новая сумма в рублях" inputmode="numeric" autocomplete="off" value="${esc(d.amountText??'')}" placeholder="${d.waitingForAmount?'Сумма в рублях…':'Сообщение…'}"><button type="button" data-action="amount-next" aria-label="Отправить сумму">↑</button></div>`}
function pageOf(list,size=6){state.page=Math.max(0,Math.min(state.page,Math.ceil(list.length/size)-1));return list.slice(state.page*size,(state.page+1)*size)}
function pages(list,size=6){return list.length>size?row(key('‹','page',-1,state.page===0),key(`${state.page+1} / ${Math.ceil(list.length/size)}`,'noop'),key('›','page',1,(state.page+1)*size>=list.length)):''}
function byBalance(list,b){return list.slice().sort((a,c)=>Number(!(b[a]||0))-Number(!(b[c]||0))||(b[c]||0)-(b[a]||0)||name(a).localeCompare(name(c),'ru'))}
function ownBalance(value){return value?`<button class="fp-balance fp-balance-main ${value>0?'fp-positive':'fp-negative'}" data-action="nav" data-value="finance" aria-label="Обновить мои финансы">${value>0?'+':'−'}${money(value)}</button>`:'<b>0 ₽</b>'}
function balance(value){return `<span class="fp-balance ${value>0?'fp-positive':value<0?'fp-negative':'fp-zero'}">${value>0?'+':value<0?'−':''}${money(value)}</span>`}
function balanceLegend(){return '<p class="fp-small">+ — получить · − — осталось доплатить<br>Баланс участника во всей группе.</p>'}
function peopleTable(ids,b,{sender=state.actor,chooseFrom=false}={}){
 return '<table class="fp-people"><thead><tr><th>Участник</th><th>Баланс</th></tr></thead><tbody>'+ids.map(id=>{
  const value=b[id]||0,label=(chooseFrom?'Выбрать отправителя':'Оформить перевод получателю')+' '+name(id);
  const amount=balance(value),action=chooseFrom?'person':'balance-transfer';
  const link=chooseFrom||id!==sender?`<a class="${value>0?'fp-positive':value<0?'fp-negative':'fp-zero'}" href="#${action}-${id}" data-action="${action}" data-value="${id}" aria-label="${esc(label)}" title="${esc(label)}">${amount}</a>`:amount;
  return `<tr><td><a href="#profile-${id}" data-action="profile" data-value="${id}">${esc(name(id))}</a></td><td>${link}</td></tr>`;
 }).join('')+'</tbody></table>';
}
function peopleHint(){return '<p class="fp-small">Нажми на имя для профиля, на баланс — для перевода.</p>'}
function paymentPeople(p,withBalances=false){
 const b=withBalances?totals():null;
 const editable=state.draft===p&&['review','duplicate'].includes(state.view);
 const person=id=>{
  if(!b)return esc(name(id));
  const value=b[id]||0,label='Подставить '+money(value)+' — баланс участника '+name(id);
  const displayed=value&&editable?`<a class="fp-balance-choice ${value>0?'fp-positive':'fp-negative'}" href="#balance-${id}" data-action="use-balance" data-value="${id}" aria-label="${esc(label)}" title="${esc(label)}">${balance(value)}</a>`:balance(value);
  return esc(name(id))+` (${displayed})`;
 };
 return `<p>От кого: ${person(p.from)}<br>Кому: ${person(p.to)}</p>`;
}
function detail(p,withBalances=false){return paymentPeople(p,withBalances||p.status==='PENDING')+`<h1 class="fp-amount">${p.amount>0?money(p.amount):'— ₽'}</h1>`+paymentAudit(p)}
function duplicate(){let d=state.draft;return g().payments.some(p=>p.status!=='CANCELLED'&&p.from===d.from&&p.to===d.to&&p.amount===d.amount&&Date.now()-p.time<86400000)}
function paymentStatus(p){return p.status==='PENDING'?'Ожидает подтверждения':p.status==='CANCELLED'?'Отменён':'Учтён'}
function canEditPayment(p){return admin()||p.status==='PENDING'&&p.from===state.actor}
function canCancelPayment(p){return p.status!=='CANCELLED'&&(admin()||p.status==='PENDING'&&p.from===state.actor)}
function cancelPayment(p){
 if(!canCancelPayment(p))throw Error('Отмена доступна отправителю до подтверждения или администратору группы');
 (p.audit??=[]).push({actor:state.actor,admin:admin(),kind:'cancel',previousStatus:p.status,time:Date.now()});
 p.status='CANCELLED';p.cancelledAt=Date.now();
}
function editPaymentAmount(p,text){
 if(!canEditPayment(p))throw Error('Изменить сумму может отправитель до подтверждения или администратор группы');
 const amount=parsePaymentAmount(text);if(amount===p.amount)return;
 (p.audit??=[]).push({actor:state.actor,admin:admin(),kind:'amount',before:p.amount,after:amount,time:Date.now()});

}

 else if(v==='groups'){body='<h2>Выбери группу</h2>';buttons=groups.map(x=>row(key(x.title,'group',x.id)));buttons.push(row(key('Назад','nav','menu')))}
 else if(v==='menu'){body='<h2>Что хочешь сделать?</h2>';buttons=[row(key('Мои финансы','nav','groups'))]}

 else if(v==='saved'){let p=g().payments.find(x=>x.id===state.selected);body='<h2>'+(p.status==='PENDING'?'Ожидает подтверждения':'Перевод учтён')+'</h2>'+detail(p)+(p.status==='PENDING'?'<p>Получатель увидит его в «Принять платёж». Баланс пока не изменился.</p>':`<p>Записал администратор: ${esc(name(p.author))}.<br>Баланс обновлён.</p>`);buttons=[];if(canEditPayment(p))buttons.push(row(key('Изменить сумму','edit-payment-amount')));if(canCancelPayment(p))buttons.push(row(key('Отменить перевод','cancel-payment')));buttons.push(row(key('К моим финансам','nav','finance')))}
 else if(v==='balances'){

 else if(v==='profile'){body='<h2>'+esc(name(state.profile))+'</h2><p>В боте эта ссылка открывает профиль участника в Telegram.</p><p class="fp-small">Здесь показан вымышленный участник.</p>';buttons=[row(key('Назад','profile-back'))]}
 else if(v==='send'){
  let list=available(),chunk=pageOf(list,3);
  body='<h2>Перевести</h2><p>'+(list.length?'Бот подобрал эти переводы для всей группы, стараясь уменьшить их количество.':'Сейчас готовых переводов нет.')+'</p><p>Можно выбрать готовый вариант или записать свой перевод — кому хочешь или с кем договорился.</p>';
  buttons=chunk.map(x=>row(key(name(x.to)+' · '+money(x.amount),'suggestion',x.to)));

  buttons.push(row(key('Записать свой перевод','own-transfer')),row(key('Назад','nav','finance')));
 }
 else if(v==='receive'){let list=pendingIncoming(),chunk=pageOf(list,3);body='<h2>'+(list.length?'Проверь поступление':'Нет переводов для подтверждения')+'</h2>'+(list.length?'<p>Выбери перевод, который уже получил.</p>':'');buttons=chunk.map(p=>row(key(name(p.from)+' · '+money(p.amount),'receive',p.id)));buttons.push(pages(list,3),row(key('Назад','nav','finance')))}
 else if(v==='receive-review'){let p=g().payments.find(x=>x.id===state.selected);body='<h2>Деньги пришли?</h2>'+`<p>От: <a href="#profile-${p.from}" data-action="profile" data-value="${p.from}">${esc(name(p.from))}</a></p><div class="fp-amount">${money(p.amount)}</div>`;buttons=[row(key('Да, получил','accept')),row(key('Назад','nav','receive'))]}
 else if(v==='received'){body='<h2>Перевод учтён</h2><p>Баланс обновлён.</p>';buttons=[row(key('К моим финансам','nav','finance'))]}
 else if(v==='history'){
  const scope=state.historyScope||'mine';
  let list=historyPayments(scope),chunk=pageOf(list,10);
  body='<h2>История переводов</h2><p class="fp-small">'+(scope==='all'?'Все переводы группы':'Мои переводы')+'</p>';
  buttons.push(row(historyTab('👤 Мои','mine'),historyTab('👥 Все','all')));
  if(!list.length)body+='<p>Переводов пока нет.</p>';
  if(list.length)body+='<table><thead><tr><th>От кого</th><th>Кому</th><th>Сумма</th><th>Дата</th><th>Статус</th></tr></thead><tbody>'+chunk.map(p=>{
   const profile=id=>`<a href="#profile-${id}" data-action="profile" data-value="${id}">${esc(name(id))}</a>`;
   const detail=text=>`<a href="#transfer-${p.id}" data-action="detail" data-value="${p.id}">${esc(text)}</a>`;
   return `<tr><td>${profile(p.from)}</td><td>${profile(p.to)}</td><td>${detail(money(p.amount))}</td><td>${detail(new Date(p.time).toLocaleDateString('ru-RU'))}</td><td>${detail(paymentStatus(p)+(p.audit?.some(x=>x.admin)?' · Правка администратора':''))}</td></tr>`;
  }).join('')+'</tbody></table>';
  body+='<p class="fp-small">Имена — профили; сумма, дата и статус — детали перевода.</p>';
  buttons.push(pages(list,10),row(key('Назад','nav','finance')));
 }
 else if(v==='detail'){
  const p=g().payments.find(x=>x.id===state.selected);
  body='<h2>Перевод</h2>'+detail(p)+`<p>${paymentStatus(p)}</p>`+(p.mode==='admin'?`<p>Записал администратор: ${esc(name(p.author))}.<br>Без подтверждения участников.</p>`:'');
  if(state.editingPaymentAmount===p.id){
   const p=g().payments.find(x=>x.id===state.selected);if(!p||!canEditPayment(p))throw Error('Изменить сумму может отправитель до подтверждения или администратор группы');
   body+='<p id="fp-amount-prompt" class="fp-small">Напиши новую сумму в рублях.</p>';
   composer=paymentComposer({amountText:state.paymentAmountText,waitingForAmount:true});
  }
  if(canEditPayment(p))buttons.push(row(key('Изменить сумму','edit-payment-amount')));

  buttons.push(row(key('Назад','detail-back')));
 }
 else if(v==='cancel-confirm'){
  const p=g().payments.find(x=>x.id===state.selected);

  buttons=[row(key('Да, отменить','confirm-cancel')),row(key('Назад','cancel-back'))];
 }
 else if(v==='cancelled'){
  const p=g().payments.find(x=>x.id===state.selected);

 screen.innerHTML=state.noticeOpened?noticeMarkup+menuMarkup:menuMarkup+noticeMarkup;

function save(){let d=state.draft;if(d.mode==='admin'&&!admin())throw Error('Запись доступна администратору этой группы');if(d.mode!=='admin'&&d.from!==state.actor)throw Error('Можно записать только свою отправку');if(d.from===d.to||!g().members.includes(d.to)||!g().members.includes(d.from))throw Error('Выбери двух разных участников этой группы');if(!Number.isSafeInteger(d.amount)||d.amount<=0)throw Error('Укажи положительную сумму в целых рублях');let p={...d,id:++sequence,status:d.mode==='admin'?'COMPLETED':'PENDING',author:state.actor,time:Date.now(),notice:d.mode!=='admin'};g().payments.push(p);state.selected=p.id;state.draft=null;go('saved')}
root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.tagName==='A')e.preventDefault();let a=el.dataset.action,v=el.dataset.value;state.error='';try{
 if(a==='amount-next')readAmount();
 else if(a==='nav'){if(v==='receive'&&pendingIncoming().length===0){window.alert('Нет переводов для подтверждения');return}state.draft=null;if(v==='history')state.historyScope='mine';go(v)}
 else if(a==='group'){state.group=+v;go('finance')}
 else if(a==='round'||a==='adjust-amount'){
  if(state.view!=='review'||!state.draft)return;
  if(a==='round'&&+v!==100||a==='adjust-amount'&&![-100,-50,50,100].includes(+v))return;
  if(a==='round'&&state.draft.roundingAvailable!==true)return;
  const current=editableAmount(state.draft);
  const amount=a==='round'?roundPaymentAmount(current):Math.max(0,current+(+v));
  if(!Number.isSafeInteger(amount))throw Error('Сумма слишком большая');
  if(a==='round'&&state.draft.roundingOriginal===undefined)state.draft.roundingOriginal=current;
  setPaymentAmount(state.draft,amount);render();
 }
 else if(a==='use-balance'){
  const d=state.draft;if(!d||!['review','duplicate'].includes(state.view)||![d.from,d.to].includes(+v))return;
  const amount=Math.abs(totals()[+v]||0);if(!Number.isSafeInteger(amount)||amount<=0)return;
  setPaymentAmount(d,amount);d.balancePresetAmount=amount;d.roundingAvailable=true;
  delete d.roundingOriginal;
  go('review');
 }
 else if(a==='reset-round'){
  const d=state.draft;if(state.view!=='review'||!d)return;
  restoreAmount(d);render();
 }

  if(!['mine','all'].includes(v))return;
  state.historyScope=v;state.page=0;render();
 }
 else if(a==='page'){state.page+=+v;render()}

  state.draft={mode:'personal',from:state.actor,to:null,amount:0,pickerReturn:'send',sendPage:state.page};go('to');

 else if(a==='transfer'||a==='balance-transfer'){
  if(state.view==='balances')state.draft={mode:'personal',from:state.actor,to:null,amount:0};
  if(!state.draft||+v===state.draft.from)throw Error('Выбери другого участника');
  state.draft.recipientView=state.view;state.draft.toPage=state.page;state.draft.to=+v;
  const amount=0;
  setPaymentAmount(state.draft,amount);state.draft.roundingAvailable=amount>0;delete state.draft.roundingOriginal;delete state.draft.balancePresetAmount;go('review');
 }
 else if(a==='edit-amount'){
  state.draft.waitingForAmount=true;render();root.querySelector('#fp-amount').focus();
 }
 else if(a==='back'){
  const d=state.draft;
  const target=state.view==='to'?(d.mode==='admin'?'from':d.pickerReturn||'finance'):({from:'finance',review:d.source==='suggestion'?'send':d.recipientView||'to',duplicate:'review'}[state.view]||'finance');
  const page=target==='send'?(d.sendPage||0):['to','balances'].includes(target)?(d.toPage||0):target==='from'?(d.fromPage||0):0;
  if(['balances','send'].includes(target))state.draft=null;
  go(target);state.page=page;render();
 }
 else if(a==='cancel'){state.draft=null;go('finance')}
 else if(a==='save'){if(state.draft.mode!=='admin'&&duplicate())go('duplicate');else save()}

 else if(a==='notice-open'){const p=g().payments.find(x=>x.id===+v);if(!p||p.to!==state.actor||p.status!=='PENDING')throw Error('Перевод недоступен для подтверждения');state.noticeOpened=true;state.selected=p.id;go('receive-review')}
 else if(a==='receive'){state.selected=+v;go('receive-review')}
 else if(a==='accept'){const p=g().payments.find(x=>x.id===state.selected);if(p.to!==state.actor||p.status!=='PENDING')throw Error('Перевод недоступен для подтверждения');p.status='COMPLETED';go('received')}
 else if(a==='edit-payment-amount'){
  const p=g().payments.find(x=>x.id===state.selected);if(!p||!canEditPayment(p))throw Error('Изменить сумму может отправитель до подтверждения или администратор группы');

  state.editingPaymentAmount=state.selected;state.paymentAmountText='';render();root.querySelector('#fp-amount').focus();
 }
 else if(a==='cancel-payment'){
  const p=g().payments.find(x=>x.id===state.selected);if(!p||!canCancelPayment(p))throw Error('Перевод больше нельзя отменить');
  state.cancelReturn=state.view;state.cancelPage=state.page;go('cancel-confirm');
 }
 else if(a==='cancel-back'){go(state.cancelReturn);state.page=state.cancelPage||0;render()}
 else if(a==='confirm-cancel'){
  const p=g().payments.find(x=>x.id===state.selected);if(!p)throw Error('Перевод недоступен');
  cancelPayment(p);go('cancelled');
 }
 else if(a==='profile'){state.profile=+v;state.profilePage=state.page;state.profileView=state.view;go('profile')}
 else if(a==='profile-back'){go(state.profileView);state.page=state.profilePage;render()}
 else if(a==='detail'){const p=g().payments.find(x=>x.id===+v);if(!p)throw Error('Перевод недоступен в этой группе');state.selected=+v;state.detailBack=state.view;state.detailPage=state.page;go('detail')}
 else if(a==='previous'){let d=state.draft;state.selected=g().payments.findLast(p=>p.status!=='CANCELLED'&&p.from===d.from&&p.to===d.to&&p.amount===d.amount).id;state.detailBack='duplicate';state.detailPage=0;go('detail')}
 else if(a==='detail-back'){go(state.detailBack);state.page=state.detailPage||0;render()}
}catch(err){state.error=err.message;render()}});
function readAmount(){
 const value=root.querySelector('#fp-amount')?.value;if(value===undefined)return;
 try{
  if(state.view==='detail'&&state.editingPaymentAmount!==null){
   const p=g().payments.find(x=>x.id===state.editingPaymentAmount);if(!p)throw Error('Перевод недоступен');
   editPaymentAmount(p,value);state.editingPaymentAmount=null;delete state.paymentAmountText;
  }else if(state.view==='review'&&state.draft)commitTypedAmount(state.draft,value);
  else return;
  state.error='';
 }catch(error){state.error=error.message}
 render();
}
root.addEventListener('input',e=>{if(e.target.id==='fp-amount'){
 if(state.view==='detail'){state.paymentAmountText=e.target.value;return}
 state.draft.amountText=e.target.value;state.draft.waitingForAmount=true;

 prompt.textContent='Напиши сумму в рублях.';prompt.classList.remove('fp-invisible');prompt.setAttribute('aria-hidden','false');
}});
root.addEventListener('keydown',e=>{if(e.target.id==='fp-amount'&&e.key==='Enter'){e.preventDefault();readAmount()}});
setInterval(()=>{
 const expired=g().payments.filter(p=>p.notice&&p.to===state.actor&&p.status==='PENDING'&&Date.now()-p.time>=12*3600000);
 if(expired.length){expired.forEach(p=>p.notice=false);render()}
},60000);
root.querySelector('#fp-role').addEventListener('change',e=>{state.actor=+e.target.value;state.draft=null;go('finance')});render();
})();
