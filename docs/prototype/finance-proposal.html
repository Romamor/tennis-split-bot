<div id="tennis-finance-proposal" aria-label="Финансовое меню бота">
<style>
#tennis-finance-proposal{--fp-bg:light-dark(#e4ebef,#101b25);--fp-surface:light-dark(#fff,#1b2b39);--fp-button:light-dark(#dcebf5,#2a4155);--fp-text:light-dark(#1b3040,#eaf2f7);--fp-muted:light-dark(#536d80,#afc3d3);--fp-accent:light-dark(#17669e,#8dceff);--fp-line:light-dark(#cbd9e2,#3a5061);--fp-warn:light-dark(#87501b,#edbf89);font:15px/1.45 system-ui,sans-serif;color:var(--fp-text);max-width:430px;margin:auto}
#tennis-finance-proposal *{box-sizing:border-box}#tennis-finance-proposal button,#tennis-finance-proposal select,#tennis-finance-proposal input{font:inherit}#tennis-finance-proposal .fp-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}#tennis-finance-proposal select{max-width:100%;padding:8px;border:1px solid var(--fp-line);border-radius:8px;background:var(--fp-surface);color:var(--fp-text)}#tennis-finance-proposal .fp-window{background:var(--fp-bg);border:1px solid var(--fp-line);border-radius:16px;overflow:hidden}#tennis-finance-proposal .fp-header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--fp-surface);border-bottom:1px solid var(--fp-line)}#tennis-finance-proposal .fp-avatar{border-radius:50%;padding:9px;background:var(--fp-button)}#tennis-finance-proposal .fp-sub{font-size:12px;color:var(--fp-muted)}#tennis-finance-proposal .fp-thread{padding:16px 10px 20px;min-height:335px}#tennis-finance-proposal .fp-message{background:var(--fp-surface);border-radius:12px 12px 12px 3px;padding:16px;overflow-wrap:anywhere}#tennis-finance-proposal h2{font-size:20px;font-weight:500;margin:0 0 12px}#tennis-finance-proposal p{margin:8px 0}#tennis-finance-proposal .fp-small{font-size:13px;color:var(--fp-muted)}#tennis-finance-proposal .fp-keys{display:grid;gap:5px;margin-top:6px}#tennis-finance-proposal .fp-row{display:flex;gap:5px}#tennis-finance-proposal button{flex:1;min-width:0;min-height:44px;cursor:pointer;background:var(--fp-button);color:var(--fp-text);border:0;border-radius:6px;padding:11px 8px;font-weight:500;overflow-wrap:anywhere}#tennis-finance-proposal button:disabled{opacity:.4;cursor:default}#tennis-finance-proposal .fp-primary{color:var(--fp-accent)}#tennis-finance-proposal .fp-input{display:flex;gap:6px;margin-top:12px;align-items:center}#tennis-finance-proposal input{width:100%;min-width:0;padding:10px;background:var(--fp-surface);color:var(--fp-text);border:1px solid var(--fp-line);border-radius:6px;font-size:16px}#tennis-finance-proposal label{display:block;margin-top:12px}#tennis-finance-proposal table{width:100%;border-collapse:collapse;margin-top:12px;border:1px solid var(--fp-line);font-size:14px}#tennis-finance-proposal th,#tennis-finance-proposal td{padding:9px 7px;border-bottom:1px solid var(--fp-line);text-align:left;font-weight:400}#tennis-finance-proposal td:last-child,#tennis-finance-proposal th:last-child{text-align:right;font-variant-numeric:tabular-nums}#tennis-finance-proposal tbody tr:nth-child(even){background:var(--fp-bg)}#tennis-finance-proposal td button{background:transparent;padding:0;text-align:left;font-weight:400;color:var(--fp-accent)}#tennis-finance-proposal .fp-warning{color:var(--fp-warn)}#tennis-finance-proposal .fp-amount{font-size:28px;font-variant-numeric:tabular-nums;margin:12px 0}#tennis-finance-proposal .fp-caption{font-size:12px;color:var(--fp-muted);margin-top:10px}
</style>
<style>
#tennis-finance-proposal .fp-composer{display:flex;gap:8px;align-items:center;padding:8px;margin-top:28px;border-radius:12px;background:var(--fp-surface)}
#tennis-finance-proposal .fp-composer input{flex:1;border:0;background:transparent;padding:10px 8px}
#tennis-finance-proposal .fp-composer button{flex:0 0 44px;border-radius:50%;padding:8px;color:var(--fp-accent);font-size:22px}
</style>
<div class="fp-tools"><label for="fp-role">Смотреть от имени</label><select id="fp-role"><option value="1">Алексей · участник</option><option value="2">Борис · администратор</option><option value="3">Вера · суперадминистратор</option></select></div>
<div class="fp-window"><div class="fp-header"><span class="fp-avatar" aria-hidden="true">🏓</span><div>Бот расчётов<div class="fp-sub" id="fp-context"></div></div></div><div class="fp-thread" id="fp-screen" aria-live="polite"></div></div>
<div class="fp-caption">Финансовое меню · демонстрационные данные · платежи не отправляются</div>
<script>
(()=>{'use strict';
const root=document.getElementById('tennis-finance-proposal'),screen=root.querySelector('#fp-screen');
const names=['Алексей','Борис','Вера','Глеб','Денис','Елена','Ирина','Кирилл','Лена','Максим','Нина','Ольга'];
const groups=[{id:1,title:'Теннис по субботам',members:names.map((_,i)=>i+1),admins:[2,3],balances:{1:-300,2:450,3:-150},played:[1,2,3,4,5,6,7,8],payments:[]},{id:2,title:'Вечерний теннис',members:[1,2,3,4,5,6],admins:[3],balances:{1:200,2:-200},played:[1,2,4],payments:[]}];
let sequence=0;const state={actor:1,group:1,view:'finance',page:0,draft:null,selected:null,error:''};
const design={recipientColumns:'1'};
const g=()=>groups.find(x=>x.id===state.group),admin=()=>g().admins.includes(state.actor),name=id=>names[id-1],money=n=>Math.abs(n).toLocaleString('ru-RU')+' ₽',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(label,action,value='',disabled=false)=>`<button type="button" data-action="${action}" data-value="${value}"${disabled?' disabled':''}>${esc(label)}</button>`,row=(...x)=>`<div class="fp-row">${x.join('')}</div>`;
const nav=()=>row(key('Назад','back'),key('Отмена','cancel'));
function go(view){state.view=view;state.page=0;state.error='';render()}
function totals(pending=false){const b={...g().balances};for(const p of g().payments)if(p.status==='COMPLETED'||pending){b[p.from]=(b[p.from]||0)+p.amount;b[p.to]=(b[p.to]||0)-p.amount}return b}
function suggestions(){const b=totals(true),send=Object.entries(b).filter(([,v])=>v<0).map(([id,v])=>({id:+id,n:-v})),get=Object.entries(b).filter(([,v])=>v>0).map(([id,v])=>({id:+id,n:v})),out=[];while(send.length&&get.length){send.sort((a,b)=>b.n-a.n||a.id-b.id);get.sort((a,b)=>b.n-a.n||a.id-b.id);let n=Math.min(send[0].n,get[0].n);out.push({from:send[0].id,to:get[0].id,amount:n});send[0].n-=n;get[0].n-=n;if(!send[0].n)send.shift();if(!get[0].n)get.shift()}return out}
function available(){return suggestions().filter(x=>x.from===state.actor)}
function pageOf(list,size=6){state.page=Math.max(0,Math.min(state.page,Math.ceil(list.length/size)-1));return list.slice(state.page*size,(state.page+1)*size)}
function pages(list,size=6){return list.length>size?row(key('‹','page',-1,state.page===0),key(`${state.page+1} / ${Math.ceil(list.length/size)}`,'noop'),key('›','page',1,(state.page+1)*size>=list.length)):''}
function detail(p){return `<p>От кого: ${esc(name(p.from))}<br>Кому: ${esc(name(p.to))}</p><div class="fp-amount">${money(p.amount)}</div>`}
function duplicate(){let d=state.draft;return g().payments.some(p=>p.from===d.from&&p.to===d.to&&p.amount===d.amount&&Date.now()-p.time<86400000)}
const pendingIncoming=()=>g().payments.filter(x=>x.to===state.actor&&x.status==='PENDING');
function render(){let v=state.view,d=state.draft,body='',buttons=[],composer='';root.querySelector('#fp-context').textContent='Личный чат · '+g().title;
 if(v==='finance'){body='<h2>Мои финансы</h2>';buttons=[row(key('Отправить платёж','nav','send'),key('Принять платёж('+pendingIncoming().length+')','nav','receive')),row(key('Другой платёж','new','personal'),key('История платежей','nav','history')),row(key('Баланс группы','nav','balances'))];if(admin())buttons.push(row(key('Записать платёж за участников','new','admin')));buttons.push(row(key('Назад','nav','menu')))}
 else if(v==='groups'){body='<h2>Выбери группу</h2>';buttons=groups.map(x=>row(key(x.title,'group',x.id)));buttons.push(row(key('Назад','nav','menu')))}
 else if(v==='menu'){body='<h2>Что хочешь сделать?</h2>';buttons=[row(key('Мои финансы','nav','groups'))]}
 else if(v==='from'||v==='to'){body='<h2>'+(v==='from'?'От кого':'Кому')+'</h2>';if(v==='to')body+=`<p class="fp-small">От кого: ${esc(name(d.from))}</p>`;let list=g().members.filter(id=>v==='from'||id!==d.from),chunk=pageOf(list);for(let i=0;i<chunk.length;i+=+design.recipientColumns)buttons.push(row(...chunk.slice(i,i+(+design.recipientColumns)).map(id=>key(name(id),'person',id))));buttons.push(pages(list),nav())}
 else if(v==='amount'){body=`<h2>Сумма перевода</h2><p>От кого: ${esc(name(d.from))}<br>Кому: ${esc(name(d.to))}</p><p>Напиши сумму в рублях.</p><p class="fp-small">Например: 350</p>`;buttons=[nav()];composer=`<div class="fp-composer" role="group" aria-label="Ответ боту"><input id="fp-amount" aria-label="Сумма в рублях" inputmode="numeric" autocomplete="off" value="${esc(d.amountText??(d.amount||''))}" placeholder="Сообщение…"><button type="button" data-action="amount-next" aria-label="Отправить сумму">↑</button></div>`}
 else if(v==='review'){body='<h2>'+(d.mode==='admin'?'Запись администратором':'Отправка платежа')+'</h2>'+detail(d);if(d.mode==='admin'){body+='<p>Сразу учтём в балансе. Подтверждение участников не требуется.</p>';if(duplicate())body+='<p class="fp-warning">За последние сутки уже есть такой же платёж.</p>';buttons=[row(key('Записать платёж','save'))]}else{body+='<p>После перевода денег нажми «Платёж отправлен». Учтём сумму после подтверждения получателя.</p>';buttons=[row(key('Платёж отправлен','save'))]}buttons.push(nav())}
 else if(v==='duplicate'){body='<h2>Это ещё один платёж?</h2>'+detail(d)+'<p>За последние сутки уже есть перевод с теми же участниками и суммой.</p>';buttons=[row(key('Да, это ещё один','save-duplicate')),row(key('Посмотреть предыдущий','previous')),nav()]}
 else if(v==='saved'){let p=g().payments.find(x=>x.id===state.selected);body='<h2>'+(p.status==='PENDING'?'Ожидает подтверждения':'Платёж учтён')+'</h2>'+detail(p)+(p.status==='PENDING'?'<p>Получатель увидит его в «Принять платёж». Баланс пока не изменился.</p>':`<p>Записал администратор: ${esc(name(p.author))}.<br>Баланс обновлён.</p>`);buttons=[row(key('К моим финансам','nav','finance'))]}
 else if(v==='balances'){let b=totals(),list=g().members.filter(id=>b[id]||g().played.includes(id)).sort((a,c)=>Number(!(b[a]||0))-Number(!(b[c]||0))||(b[c]||0)-(b[a]||0)||name(a).localeCompare(name(c),'ru')),chunk=pageOf(list,5);body='<h2>Баланс группы</h2><table><thead><tr><th>Участник</th><th>Баланс</th></tr></thead><tbody>'+chunk.map(id=>`<tr><td>${esc(name(id))}</td><td>${b[id]?((b[id]>0?'+':'−')+money(b[id])):'0 ₽'}</td></tr>`).join('')+'</tbody></table><p class="fp-small">+ — участнику осталось получить<br>− — участнику осталось внести</p>';if(g().payments.some(p=>p.status==='PENDING'))body+='<p class="fp-small">Ожидающие подтверждения платежи пока не учтены.</p>';buttons=[pages(list,5),row(key('Назад','nav','finance'))]}
 else if(v==='send'){let list=available(),chunk=pageOf(list,3);body='<h2>'+(list.length?'Доступные платежи':'Нет доступных платежей')+'</h2>';buttons=chunk.map(x=>row(key(name(x.to)+' · '+money(x.amount),'suggestion',x.to)));buttons.push(pages(list,3),row(key('Назад','nav','finance')))}
 else if(v==='receive'){let list=pendingIncoming(),chunk=pageOf(list,3);body='<h2>'+(list.length?'Принять платёж':'Нет платежей для принятия')+'</h2>';buttons=chunk.map(p=>row(key(name(p.from)+' · '+money(p.amount),'receive',p.id)));buttons.push(pages(list,3),row(key('Назад','nav','finance')))}
 else if(v==='receive-review'){let p=g().payments.find(x=>x.id===state.selected);body='<h2>Деньги пришли?</h2>'+detail(p);buttons=[row(key('Да, получил','accept')),row(key('Назад','nav','receive'))]}
 else if(v==='received'){body='<h2>Платёж учтён</h2><p>Баланс обновлён.</p>';buttons=[row(key('К моим финансам','nav','finance'))]}
 else if(v==='history'){let list=g().payments.filter(p=>[p.from,p.to].includes(state.actor)).slice().reverse(),chunk=pageOf(list,5);body='<h2>История платежей</h2>';if(!list.length)body+='<p>Платежей пока нет.</p>';if(list.length)body+='<table><thead><tr><th>Перевод</th><th>Сумма / статус</th></tr></thead><tbody>'+chunk.map(p=>`<tr><td>${key(name(p.from)+' → '+name(p.to),'detail',p.id)}</td><td>${money(p.amount)}<br><span class="fp-small">${p.status==='PENDING'?'В процессе':'Выполнен'}</span></td></tr>`).join('')+'</tbody></table>';buttons.push(pages(list,5),row(key('Назад','nav','finance')))}
 else if(v==='detail'){let p=g().payments.find(x=>x.id===state.selected);body='<h2>Платёж</h2>'+detail(p)+`<p>${p.status==='PENDING'?'Ожидает подтверждения':'Учтён'}</p>`+(p.mode==='admin'?`<p>Записал администратор: ${esc(name(p.author))}.<br>Без подтверждения участников.</p>`:'');buttons=[row(key('Назад','detail-back'))]}
 screen.innerHTML=`<div class="fp-message">${body}${state.error?`<p class="fp-warning" role="alert">${esc(state.error)}</p>`:''}</div><div class="fp-keys">${buttons.join('')}</div>${composer}`;
}
function save(){let d=state.draft;if(d.mode==='admin'&&!admin())throw Error('Запись доступна администратору этой группы');if(d.mode!=='admin'&&d.from!==state.actor)throw Error('Можно записать только свою отправку');if(d.from===d.to||!g().members.includes(d.to)||!g().members.includes(d.from))throw Error('Выбери двух разных участников этой группы');if(!Number.isSafeInteger(d.amount)||d.amount<=0)throw Error('Укажи положительную сумму в целых рублях');let p={...d,id:++sequence,status:d.mode==='admin'?'COMPLETED':'PENDING',author:state.actor,time:Date.now()};g().payments.push(p);state.selected=p.id;state.draft=null;go('saved')}
root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,v=el.dataset.value;try{
 if(a==='amount-next')readAmount();
 else if(a==='nav'){state.draft=null;go(v)}
 else if(a==='group'){state.group=+v;go('finance')}
 else if(a==='page'){state.page+=+v;render()}
 else if(a==='new'){if(v==='admin'&&!admin())throw Error('Нужны права администратора этой группы');state.draft={mode:v,from:v==='admin'?null:state.actor,to:null,amount:0};go(v==='admin'?'from':'to')}
 else if(a==='person'){if(state.view==='from'){state.draft.from=+v;state.draft.to=null;go('to')}else{state.draft.to=+v;go('amount')}}
 else if(a==='back'){if(state.view==='to')go(state.draft.mode==='admin'?'from':'finance');else go({from:'finance',amount:'to',review:'amount',duplicate:'review'}[state.view]||'finance')}
 else if(a==='cancel'){state.draft=null;go('finance')}
 else if(a==='save'){if(state.draft.mode!=='admin'&&duplicate())go('duplicate');else save()}
 else if(a==='save-duplicate')save();
 else if(a==='suggestion'){const x=available().find(x=>x.to===+v);state.draft={...x,mode:'personal'};go('review')}
 else if(a==='receive'){state.selected=+v;go('receive-review')}
 else if(a==='accept'){const p=g().payments.find(x=>x.id===state.selected);if(p.to!==state.actor||p.status!=='PENDING')throw Error('Платёж недоступен для подтверждения');p.status='COMPLETED';go('received')}
 else if(a==='detail'){state.selected=+v;state.detailBack='history';go('detail')}
 else if(a==='previous'){let d=state.draft;state.selected=g().payments.findLast(p=>p.from===d.from&&p.to===d.to&&p.amount===d.amount).id;state.detailBack='duplicate';go('detail')}
 else if(a==='detail-back')go(state.detailBack);
}catch(err){state.error=err.message;render()}});
function readAmount(){let v=root.querySelector('#fp-amount').value.trim();if(!/^\d+$/.test(v)||!Number.isSafeInteger(+v)||+v<=0){state.error='Укажи положительную сумму в целых рублях';render();return}state.draft.amount=+v;go('review')}
root.addEventListener('input',e=>{if(e.target.id==='fp-amount')state.draft.amountText=e.target.value});
root.addEventListener('keydown',e=>{if(e.target.id==='fp-amount'&&e.key==='Enter'){e.preventDefault();readAmount()}});
root.querySelector('#fp-role').addEventListener('change',e=>{state.actor=+e.target.value;state.draft=null;go('finance')});render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'recipientColumns',{label:'Участников в строке',options:[{label:'Один',value:'1'},{label:'Два',value:'2'}]})}
})();
</script>
</div>
